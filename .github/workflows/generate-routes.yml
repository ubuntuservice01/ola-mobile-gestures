name: Validate MobiGest web app

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/functions/**"
      - "package.json"
      - "vite.config.ts"
      - "tsr.config.json"
      - ".github/workflows/generate-routes.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/functions/**"
      - "package.json"
      - "vite.config.ts"
      - "tsr.config.json"
      - ".github/workflows/generate-routes.yml"

permissions:
  contents: write

jobs:
  validate-web:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install

      - name: Generate route tree
        run: npm run generate-routes

      - name: Audit internal routes
        run: npm run audit-routes

      - name: Type-check application
        run: npm run typecheck

      - name: Check Edge Functions
        run: deno check supabase/functions/admin-users/index.ts

      - name: Build application
        run: npm run build

      - name: Commit generated route tree
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate TanStack route tree [skip ci]"
          git push
