name: Generate TanStack route tree

on:
  push:
    branches:
      - main
    paths:
      - "src/routes/**"
      - "tsr.config.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  generate-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate route tree
        run: npm run generate-routes

      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate TanStack route tree [skip ci]"
          git push
